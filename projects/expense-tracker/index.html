<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark"><i class="bi bi-wallet2"></i> Expense Tracker Pro</h1>
        <p>Manage your finances with ease</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="glass-card p-4 text-center">
                <h5 class="text-muted">Total Balance</h5>
                <h2 id="balance" class="fw-bold text-dark">₹0.00</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-4 text-center border-left-success">
                <h5 class="text-muted">Income <i class="bi bi-arrow-up-circle text-success"></i></h5>
                <h3 id="income" class="fw-bold text-success">₹0.00</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-4 text-center border-left-danger">
                <h5 class="text-muted">Expense <i class="bi bi-arrow-down-circle text-danger"></i></h5>
                <h3 id="expense" class="fw-bold text-danger">₹0.00</h3>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="glass-card p-4">
                <h4 class="mb-4">Add Transaction</h4>
                <form id="form">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="text" class="form-control" placeholder="e.g., Salary, Rent, Groceries" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="amount" class="form-control" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Type</label>
                        <select id="type" class="form-select" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100 fw-bold shadow-sm" type="submit" id="submit-btn">
                        Add Transaction
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="glass-card p-4 h-100">
                <h4 class="mb-4">Transaction History</h4>
                <ul id="list" class="list-group list-group-flush list-unstyled">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
