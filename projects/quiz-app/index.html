<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <h1>Web Dev Masterclass Quiz</h1>
            <p>Test your knowledge of HTML, CSS, and JavaScript. The quiz consists of 10 questions.</p>
            <button id="start-btn" class="primary-btn">Start Quiz</button>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen">
            <header class="quiz-header">
                <div class="progress-text">Question <span id="current-q-num">1</span> of <span id="total-q-num">10</span></div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </header>
            
            <div class="question-container">
                <h2 id="question-text">Question goes here</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options will be injected here via JS -->
                </div>
            </div>

            <footer class="quiz-footer">
                <button id="next-btn" class="primary-btn" disabled>Next</button>
            </footer>
        </section>

        <!-- Results Screen -->
        <section id="results-screen" class="screen">
            <h2>Quiz Complete!</h2>
            <div class="score-display">
                <span id="score-percentage">0%</span>
            </div>
            <p id="score-message">Message goes here</p>
            <p class="score-breakdown">You got <span id="score-correct">0</span> out of <span id="score-total">10</span> correct.</p>
            
            <div class="results-actions">
                <button id="review-btn" class="secondary-btn">Review Answers</button>
                <button id="restart-btn" class="primary-btn">Restart Quiz</button>
            </div>
        </section>

        <!-- Review Screen -->
        <section id="review-screen" class="screen">
            <h2>Review Your Answers</h2>
            <div id="review-list" class="review-list">
                <!-- Review items injected here -->
            </div>
            <button id="back-to-results-btn" class="primary-btn">Back to Results</button>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/questions.js"></script>
    <script src="js/state.js"></script>
    <script src="js/quiz-logic.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
