<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right">
                <button id="toggle-model">Add New Task</button>
            </div>
        </nav>

        <section class="board">
            <div class="task-column" id="todo">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right count">0</div>
                </div>
            </div>

            <div class="task-column" id="progress">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right count">0</div>
                </div>
            </div>

            <div class="task-column" id="done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right count">0</div>
                </div>
            </div>
        </section>
    </main>

    <div class="model">
        <div class="model-bg"></div>
        <div class="center">
            <input type="text" id="task-title-input" placeholder="Task Title">
            <textarea id="task-description-input" placeholder="Task Description"></textarea>
            <button id="add-new-task">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
