<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live News Feed Aggregator">
    <title>Live News Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1 class="logo"><span class="logo-serif">News</span><span class="logo-sans">Flow.</span></h1>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search news...">
            <select id="category-select">
                <option value="all">All Categories</option>
                <option value="business">Business</option>
                <option value="technology">Technology</option>
                <option value="entertainment">Entertainment</option>
                <option value="sports">Sports</option>
                <option value="science">Science</option>
                <option value="health">Health</option>
            </select>
            <button id="search-btn">Search</button>
        </div>
    </header>

    <main>
        <div id="loading-spinner" class="spinner hidden"></div>
        <div id="error-message" class="error hidden"></div>
        <div id="news-container" class="news-grid"></div>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
