<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Board</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="board-container">
        <header>
            <h1><span class="font-playfair">Kanban</span> <span class="font-inter">Task Board</span></h1>
            <div class="add-task-container">
                <input type="text" id="taskInput" placeholder="Enter a new task...">
                <button id="addTaskBtn" onclick="addTask()">Add Task</button>
            </div>
        </header>

        <div class="board">
            <div class="column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h2 class="column-header todo-header">To Do</h2>
                <div class="task-list" id="todo-list">
                </div>
            </div>

            <div class="column" id="progress" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h2 class="column-header progress-header">In Progress</h2>
                <div class="task-list" id="progress-list">
                </div>
            </div>

            <div class="column" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h2 class="column-header done-header">Done</h2>
                <div class="task-list" id="done-list">
                </div>
            </div>
        </div>
    </div>

    <script src="./js/storage.js"></script>
    <script src="./js/dragdrop.js"></script>
    <script src="./js/tasks.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
